      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  emc_lb_src_pkg_entities.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
