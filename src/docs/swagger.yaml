        minItems: 1
        type: array
      payment_method:
        type: string
      shipping_address:
        type: string
    required:
    - contact_phone
    - items
    - payment_method
    - shipping_address
    type: object
  emc_lb_src_pkg_entities.CreateProductRequest:
    properties:
      allow_backorder:
        type: boolean
      brand_id:
        type: string
      category_id:
        type: string
      description:
        maxLength: 2000
        type: string
      images:
        items:
          type: string
        type: array
      is_featured:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
      original_price:
        minimum: 0
        type: number
      price:
        minimum: 0
        type: number
      shop_id:
        type: string
      short_desc:
        maxLength: 500
        type: string
      sku:
        maxLength: 100
        type: string
      slug:
        maxLength: 255
        minLength: 1
        type: string
      status:
        enum:
        - active
        - draft
        - inactive
        type: string
      stock:
        minimum: 0
        type: integer
      tags:
        items:
          type: string
        type: array
      thumbnail:
        maxLength: 2048
        type: string
    required:
    - name
    - price
    type: object
  emc_lb_src_pkg_entities.CreateShopRequest:
    properties:
      description:
