      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - Categories
  /api/v1/categories/{id}:
    delete:
      description: Soft-delete a category (requires category:delete permission)
      parameters:
