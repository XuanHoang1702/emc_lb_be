      - Categories
    get:
      description: Get a single category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      summary: Get category by ID
      tags:
      - Categories
    patch:
      consumes:
      - application/json
      description: Update an existing category (requires category:update permission)
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emc_lb_src_pkg_entities.UpdateCategoryRequest'
