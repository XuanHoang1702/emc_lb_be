        type: string
      meta_title:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      parent_id:
        type: string
      position:
        type: integer
      slug:
        maxLength: 255
        minLength: 1
        type: string
      status:
        enum:
        - active
        - inactive
        - draft
        type: string
      thumbnail:
        maxLength: 2048
        type: string
    required:
    - name
    type: object
  emc_lb_src_pkg_entities.CreateCouponRequest:
    properties:
      code:
        type: string
      end_date:
        type: string
      is_active:
        type: boolean
      max_discount_amount:
        minimum: 0
        type: number
      min_order_amount:
        minimum: 0
        type: number
      start_date:
        type: string
      type:
        enum:
        - percentage
        - fixed_amount
        type: string
      usage_limit:
        minimum: 0
        type: integer
      value:
        type: number
    required:
    - code
    - end_date
    - start_date
    - type
    - value
    type: object
  emc_lb_src_pkg_entities.CreateOrderRequest:
    properties:
      contact_phone:
        type: string
      coupon_code:
        type: string
      items:
