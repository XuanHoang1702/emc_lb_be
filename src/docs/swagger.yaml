  emc_lb_src_pkg_entities.SePayIPNRequest:
    properties:
      notification_type:
        description: ORDER_PAID
        type: string
      order:
        $ref: '#/definitions/emc_lb_src_pkg_entities.SePayIPNOrder'
      timestamp:
