host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: API documentation for the EMC Load Balancer Service.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: EMC Load Balancer API
  version: "1.0"
paths:
  /api/v1/brands:
    get:
      description: Get all brands
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      summary: List brands
      tags:
      - Brands
    post:
      consumes:
      - application/json
      description: Create a new brand
      parameters:
      - description: Brand details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emc_lb_src_pkg_entities.CreateBrandRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Create brand
      tags:
      - Brands
  /api/v1/brands/{id}:
    delete:
      description: Soft-delete a brand
      parameters:
      - description: Brand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete brand
      tags:
      - Brands
    get:
      description: Get a single brand by its ID
      parameters:
      - description: Brand ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      summary: Get brand by ID
      tags:
      - Brands
    patch:
      consumes:
      - application/json
      description: Update an existing brand
      parameters:
      - description: Brand ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emc_lb_src_pkg_entities.UpdateBrandRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Update brand
      tags:
      - Brands
  /api/v1/cart:
    delete:
      description: Remove all items from the shopping cart
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Clear cart
      tags:
      - Cart
    get:
      description: Get the shopping cart for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Get cart
      tags:
      - Cart
  /api/v1/cart/coupon:
    post:
      consumes:
      - application/json
      description: Apply a discount coupon code to the shopping cart
      parameters:
      - description: Coupon code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emc_lb_src_pkg_entities.ApplyCouponRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Apply coupon to cart
      tags:
      - Cart
  /api/v1/cart/items:
    post:
      consumes:
      - application/json
      description: Add a product to the shopping cart
      parameters:
      - description: Item to add
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emc_lb_src_pkg_entities.AddCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Add item to cart
      tags:
      - Cart
  /api/v1/cart/items/{productId}:
    delete:
      description: Remove a product from the shopping cart
      parameters:
      - description: Product ID
        in: path
        name: productId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Remove item from cart
      tags:
      - Cart
    put:
      consumes:
      - application/json
      description: Update quantity of a product in the cart
      parameters:
      - description: Product ID
        in: path
        name: productId
        required: true
        type: string
      - description: New quantity
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/emc_lb_src_pkg_entities.UpdateCartItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Update cart item
      tags:
      - Cart
  /api/v1/categories:
    get:
      description: Get all product categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      summary: List categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Create a new product category (requires category:create permission)
      parameters:
      - description: Category details
        in: body
        name: body
        required: true
        schema:
