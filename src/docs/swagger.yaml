basePath: /
definitions:
  emc_lb_src_pkg_entities.AddCartItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        minimum: 1
        type: integer
    required:
    - product_id
    - quantity
    type: object
  emc_lb_src_pkg_entities.ApplyCouponRequest:
    properties:
      coupon_code:
        type: string
    required:
    - coupon_code
    type: object
  emc_lb_src_pkg_entities.CheckoutInitRequest:
    properties:
      cancel_url:
        type: string
      customer_id:
        type: string
      error_url:
        type: string
      order_amount:
        type: number
      order_description:
        type: string
      order_invoice_number:
        type: string
      payment_method:
        description: BANK_TRANSFER, CARD, etc.
        type: string
      success_url:
        type: string
    required:
    - order_amount
    - order_description
    - order_invoice_number
    type: object
  emc_lb_src_pkg_entities.CreateBrandRequest:
    properties:
      banner:
        maxLength: 2048
        type: string
      company_name:
        maxLength: 255
        type: string
      country:
        maxLength: 120
        type: string
      description:
        maxLength: 2000
        type: string
      email:
        maxLength: 255
        type: string
      is_featured:
        type: boolean
      logo:
        maxLength: 2048
        type: string
      meta_description:
        maxLength: 500
        type: string
      meta_keywords:
        items:
          type: string
        type: array
      meta_title:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      phone:
        type: string
      position:
        type: integer
      slug:
        maxLength: 255
        minLength: 1
        type: string
      status:
        enum:
        - active
        - inactive
        - draft
        type: string
      website:
        maxLength: 2048
        type: string
    required:
    - name
    type: object
  emc_lb_src_pkg_entities.CreateCategoryRequest:
