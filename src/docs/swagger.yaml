          description: OK
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/emc_lb_src_pkg_res.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete category
