<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
</head>
<body style="font-family: sans-serif; background-color: #f4f4f5; padding: 40px 0; margin: 0; color: #18181b;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <h1 style="color: #2563eb; font-size: 24px; margin-top: 0;">Payment Successful</h1>
        <p>Hi <strong>{{.CustomerName}}</strong>,</p>

        <p style="margin-top: 30px; color: #71717a; font-size: 14px;">
            Thank you,<br>
            EMC LB Team
        </p>
    </div>
</body>
</html>
