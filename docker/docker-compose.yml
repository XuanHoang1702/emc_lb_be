version: '3.9'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15
    env_file: ../.env.development
    command: postgres -c timezone=Asia/Ho_Chi_Minh
    environment:
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - emc-network
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  mongo:
    image: mongo:7
    env_file: ../.env.development
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - emc-network
    logging: *default-logging
    # Single-node replica set: required for the multi-document transactions
    # used in order creation. The healthcheck initializes the replica set on
    # first boot and then reports healthy once a primary has been elected.
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}).ok }' | grep -q 1" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis:
    image: redis:7
    command: ["sh", "-c", "redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    env_file: ../.env.development
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    networks:
      - emc-network
    logging: *default-logging
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  localstack:
    image: localstack/localstack:3.4.0
    env_file: ../.env.development
    environment:
      - AWS_DEFAULT_REGION=$${AWS_REGION}
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack
    networks:
      - emc-network
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  emc_api_node_1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ../.env.development
    environment:
      APP_PORT: 8080
      GIN_MODE: release
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCALSTACK_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emc-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  emc_api_node_2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ../.env.development
    environment:
      APP_PORT: 8080
      GIN_MODE: release
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCALSTACK_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emc-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  emc_api_node_3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: always
    env_file: ../.env.development
    environment:
      APP_PORT: 8080
      GIN_MODE: release
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCALSTACK_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emc-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  emc_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: always
    env_file: ../.env.development
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCALSTACK_ENDPOINT: http://localstack:4566
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - emc-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - emc_api_node_1
      - emc_api_node_2
      - emc_api_node_3
    networks:
      - emc-network
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  pgdata:
  mongodata:
  redisdata:
  localstackdata:

networks:
  emc-network:
    driver: bridge
