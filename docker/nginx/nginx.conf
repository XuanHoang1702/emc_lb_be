worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Security: Hide Nginx version
    server_tokens off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Optimization: Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Re-resolve upstream hostnames via Docker embedded DNS so IP changes on
    # container restart are picked up automatically (avoids stale IPs).
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream backend_cluster {
        # Shared memory zone is required for run-time DNS resolution
        zone backend_cluster 64k;

        # Round Robin Load Balancing (default) with passive health checks:
        # mark a server down after 3 consecutive failures, retry after 10s.
        server emc_api_node_1:8080 max_fails=3 fail_timeout=10s resolve;
        server emc_api_node_2:8080 max_fails=3 fail_timeout=10s resolve;
        server emc_api_node_3:8080 max_fails=3 fail_timeout=10s resolve;

        # Keepalive connections to upstream for better performance
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Failover to next upstream on connection errors/timeouts/5xx
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            # Bounded timeouts so a dead node doesn't hang requests.
            # Keep connect timeout low so failover to the next node is fast
            # even when several nodes in the cluster are down.
            proxy_connect_timeout 1s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;

            # HTTP/1.1 keepalive proxying to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
