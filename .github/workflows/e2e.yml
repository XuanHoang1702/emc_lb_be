      - name: Validate Environment
        env:
          # Secrets
          API_KEY: ${{ secrets.API_KEY }}
          SYSTEM_SECRET: ${{ secrets.SYSTEM_SECRET }}

          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}

          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}

          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          SEPAY_MERCHANT_ID: ${{ secrets.SEPAY_MERCHANT_ID }}
          SEPAY_SECRET_KEY: ${{ secrets.SEPAY_SECRET_KEY }}

          # Variables
          APP_PORT: ${{ vars.APP_PORT }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}

          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}

          MONGO_INITDB_ROOT_USERNAME: ${{ vars.MONGO_INITDB_ROOT_USERNAME }}
          MONGO_DB: ${{ vars.MONGO_DB }}

          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}

          SEPAY_ENV: ${{ vars.SEPAY_ENV }}

        run: |
          set -e

          check_secret() {
            if [ -z "$1" ]; then
              echo "❌ Missing secret: $2"
              exit 1
            fi

            echo "✅ Secret available: $2"
          }

          check_variable() {
            if [ -z "$1" ]; then
              echo "❌ Missing variable: $2"
              exit 1
            fi

            echo "✅ Variable available: $2"
          }

          echo "======================================"
          echo "Checking GitHub Environment: develop"
          echo "======================================"

          check_secret "$API_KEY" "API_KEY"
          check_secret "$SYSTEM_SECRET" "SYSTEM_SECRET"
          check_secret "$POSTGRES_PASSWORD" "POSTGRES_PASSWORD"
          check_secret "$MONGO_INITDB_ROOT_PASSWORD" "MONGO_INITDB_ROOT_PASSWORD"
          check_secret "$REDIS_PASSWORD" "REDIS_PASSWORD"
          check_secret "$ACCESS_TOKEN_SECRET" "ACCESS_TOKEN_SECRET"
          check_secret "$REFRESH_TOKEN_SECRET" "REFRESH_TOKEN_SECRET"
          check_secret "$SMTP_USERNAME" "SMTP_USERNAME"
          check_secret "$SMTP_PASSWORD" "SMTP_PASSWORD"
          check_secret "$SEPAY_MERCHANT_ID" "SEPAY_MERCHANT_ID"
          check_secret "$SEPAY_SECRET_KEY" "SEPAY_SECRET_KEY"

          check_variable "$APP_PORT" "APP_PORT"
          check_variable "$POSTGRES_HOST" "POSTGRES_HOST"
          check_variable "$POSTGRES_PORT" "POSTGRES_PORT"
          check_variable "$POSTGRES_USER" "POSTGRES_USER"
          check_variable "$POSTGRES_DB" "POSTGRES_DB"
          check_variable "$REDIS_HOST" "REDIS_HOST"
          check_variable "$REDIS_PORT" "REDIS_PORT"
          check_variable "$MONGO_INITDB_ROOT_USERNAME" "MONGO_INITDB_ROOT_USERNAME"
          check_variable "$MONGO_DB" "MONGO_DB"
          check_variable "$SMTP_HOST" "SMTP_HOST"
          check_variable "$SMTP_PORT" "SMTP_PORT"
          check_variable "$SMTP_FROM_EMAIL" "SMTP_FROM_EMAIL"
          check_variable "$SEPAY_ENV" "SEPAY_ENV"

          echo "======================================"
          echo "✅ All required environment values exist"
          echo "======================================"