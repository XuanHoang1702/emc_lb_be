name: "🌐 E2E · Business Flow Tests"

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"

jobs:
  e2e:
    name: "🌐 E2E · Business Flow Tests"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Go ${{ env.GO_VERSION }}"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: "🔧 Prepare CI environment file"
        run: |
          echo "══════════════════════════════════════════"
          echo "  E2E · BUSINESS FLOW TESTS"
          echo "  Step 1/4: Preparing environment"
          echo "══════════════════════════════════════════"

          cat > .env.ci <<'EOF'
          APP_PORT=8080
          APP_ENV=test
          API_KEY=ci_e2e_api_key
          SYSTEM_SECRET=ci_e2e_secret

          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=emc_lb
          DATABASE_URL=postgres://postgres:postgres@postgres:5432/emc_lb?sslmode=disable

          MONGO_INITDB_ROOT_USERNAME=root
          MONGO_INITDB_ROOT_PASSWORD=mongo_pass
          MONGO_URI=mongodb://root:mongo_pass@mongo:27017/?authSource=admin
          MONGO_DB=emc_lb

          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=redis_pass

          LOCALSTACK_ENDPOINT=http://localstack:4566
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          S3_AVATAR_BUCKET=emc-lb-avatars

          ACCESS_TOKEN_SECRET=e2e_access_secret
          REFRESH_TOKEN_SECRET=e2e_refresh_secret
          ACCESS_TOKEN_TTL=15m
          REFRESH_TOKEN_TTL=168h

          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USERNAME=test
          SMTP_PASSWORD=test
          SMTP_FROM_EMAIL=no-reply@example.com
          SMTP_FROM_NAME=EMC LB

          SEPAY_ENV=sandbox
          SEPAY_MERCHANT_ID=test
          SEPAY_SECRET_KEY=test
          EOF

          echo "✅ Environment file created."

      - name: "🧪 Run business-flow E2E tests"
        env:
          ECC_ENV_FILE_ABS: .env.ci
          ECC_ENV_FILE: ../.env.ci
          COMPOSE_FILE: docker/docker-compose.yml
          BASE_URL: http://localhost
          MONGO_USER: root
          MONGO_PASS: mongo_pass
          REDIS_PASS: redis_pass
        run: |
          echo "══════════════════════════════════════════"
          echo "  E2E · BUSINESS FLOW TESTS"
          echo "  Step 2/4: Running E2E test suite"
          echo "══════════════════════════════════════════"

          bash e2e/e2e-test.sh

      - name: "📋 Collect logs on failure"
        if: failure()
        run: |
          echo "── Collecting docker compose logs (last 100 lines) ──"
          docker compose --env-file .env.ci -f docker/docker-compose.yml logs --tail=100 || true

      - name: "🧹 Tear down stack"
        if: always()
        run: |
          echo "── Tearing down docker compose stack ──"
          docker compose --env-file .env.ci -f docker/docker-compose.yml down -v --remove-orphans || true

      - name: "📝 Write E2E Summary"
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"; MSG="All business flow E2E tests passed."
          else
            ICON="❌"; MSG="E2E test failures detected — check logs above."
          fi

          {
            echo "## 🌐 E2E · Business Flow Tests"
            echo ""
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Stack | PostgreSQL + MongoDB + Redis + Localstack + API + Nginx |"
            echo "| Test Script | \`e2e/e2e-test.sh\` |"
            echo "| Status | ${ICON} ${MSG} |"
          } >> "$GITHUB_STEP_SUMMARY"