name: "🔬 CodeQL · Semantic Analysis"

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "🔬 CodeQL · Analyze Go"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["go"]
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🔬 Initialize CodeQL (${{ matrix.language }})"
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: "🏗️ Autobuild"
        uses: github/codeql-action/autobuild@v3

      - name: "🔍 Perform CodeQL analysis"
        uses: github/codeql-action/analyze@v3

      - name: "📝 Write CodeQL Summary"
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"; MSG="No security issues detected."
          else
            ICON="❌"; MSG="Security issues found — check Security tab for details."
          fi

          {
            echo "## 🔬 CodeQL · Semantic Analysis"
            echo ""
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Language | Go |"
            echo "| Schedule | Weekly (Monday 03:00 UTC) |"
            echo "| Status | ${ICON} ${MSG} |"
            echo ""
            echo "Results are available in the **Security** tab → **Code scanning alerts**."
          } >> "$GITHUB_STEP_SUMMARY"