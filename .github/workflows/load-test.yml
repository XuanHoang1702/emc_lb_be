name: "📈 Load Test · k6 Performance Suite"

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loadtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.13"

jobs:
  load-test:
    name: "📈 k6 Load Test (nginx LB → 3 API nodes)"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Go ${{ env.GO_VERSION }}"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # ── Step 1/7: Environment ────────────────────────────────
      - name: "🔧 Step 1/7 · Prepare CI environment file"
        run: |
          echo "══════════════════════════════════════════"
          echo "  LOAD TEST · k6 PERFORMANCE SUITE"
          echo "  Step 1/7: Preparing environment"
          echo "══════════════════════════════════════════"

          cat > .env.ci <<'EOF'
          APP_PORT=8080
          APP_ENV=test
          API_KEY=ci_loadtest_api_key
          SYSTEM_SECRET=ci_loadtest_secret

          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=emc_lb
          DATABASE_URL=postgres://postgres:postgres@postgres:5432/emc_lb?sslmode=disable

          MONGO_INITDB_ROOT_USERNAME=root
          MONGO_INITDB_ROOT_PASSWORD=mongo_pass
          MONGO_URI=mongodb://root:mongo_pass@mongo:27017/?authSource=admin
          MONGO_DB=emc_lb

          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=redis_pass

          LOCALSTACK_ENDPOINT=http://localstack:4566
          AWS_REGION=us-east-1
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          S3_AVATAR_BUCKET=emc-lb-avatars

          ACCESS_TOKEN_SECRET=loadtest_access_secret
          REFRESH_TOKEN_SECRET=loadtest_refresh_secret
          ACCESS_TOKEN_TTL=15m
          REFRESH_TOKEN_TTL=168h

          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_USERNAME=test
          SMTP_PASSWORD=test
          SMTP_FROM_EMAIL=no-reply@example.com
          SMTP_FROM_NAME=EMC LB

          SEPAY_ENV=sandbox
          SEPAY_MERCHANT_ID=test
          SEPAY_SECRET_KEY=test
          EOF

          echo "✅ Environment file created."

      # ── Step 2/7: Stack ──────────────────────────────────────
      - name: "🚀 Step 2/7 · Start full stack (postgres, mongo, redis, localstack, 3×API, nginx)"
        env:
          ECC_ENV_FILE: ../.env.ci
        run: |
          echo "══════════════════════════════════════════"
          echo "  Step 2/7: Starting docker compose stack"
          echo "══════════════════════════════════════════"

          docker compose \
            --env-file .env.ci \
            -f docker/docker-compose.yml \
            up -d --build

      # ── Step 3/7: Health ─────────────────────────────────────
      - name: "🏥 Step 3/7 · Wait for nginx + API cluster health"
        run: |
          echo "── Waiting for stack health (max 7.5 min) ──"
          for i in {1..90}; do
            if curl -sf http://localhost/health 2>/dev/null | grep -q '"status":"up"'; then
              echo "✅ nginx + API cluster ready (attempt $i)."
              break
            fi
            echo "⏳ Waiting for stack... ($i/90)"
            sleep 5
          done

          curl -sf http://localhost/health || {
            echo "❌ Stack never became healthy"
            docker compose -f docker/docker-compose.yml logs
            exit 1
          }

      # ── Step 4/7: Seed Postgres ──────────────────────────────
      - name: "🌱 Step 4/7 · Seed PostgreSQL data (roles, users)"
        run: |
          echo "── Seeding PostgreSQL data ──"
          export POSTGRES_DSN="postgres://postgres:postgres@localhost:5432/emc_lb?sslmode=disable"
          export SYSTEM_SECRET=ci_loadtest_secret

          if [ -f src/cmd/seed/main.go ]; then
            go run ./src/cmd/seed 2>/dev/null || echo "⚠️ Seed skipped (roles may already exist)"
          fi

          if [ -f src/cmd/loadtest-seed/main.go ]; then
            echo "── Creating 200 load test users ──"
            LOADTEST_USERS=200 go run ./src/cmd/loadtest-seed
          fi

          echo "✅ PostgreSQL seeding complete."

      # ── Step 5/7: Seed MongoDB ───────────────────────────────
      - name: "🌱 Step 5/7 · Seed MongoDB data (20 products)"
        env:
          ECC_ENV_FILE: ../.env.ci
        run: |
          echo "── Seeding MongoDB products ──"
          docker compose --env-file .env.ci -f docker/docker-compose.yml exec -T mongo mongosh --quiet \
            --username root --password mongo_pass --authenticationDatabase admin \
            --eval '
            const dbc = db.getSiblingDB("emc_lb");
            for (let i = 1; i <= 20; i++) {
              const slug = `loadtest-product-${i}`;
              const existing = dbc.products.findOne({ slug });
              if (!existing) {
                dbc.products.insertOne({
                  shop_id: `shop_lt_${(i % 3) + 1}`,
                  name: `LoadTest Product ${i}`,
                  slug,
                  description: "load test product",
                  short_desc: "lt",
                  price: 100000 + i * 5000,
                  original_price: 150000 + i * 5000,
                  cost_price: 50000 + i * 2000,
                  sku: `LT-${String(i).padStart(4, "0")}`,
                  barcode: `lt-${String(i).padStart(4, "0")}`,
                  stock: 1000000,
                  sold_count: 0,
                  allow_backorder: false,
                  thumbnail: "",
                  images: [],
                  attributes: {},
                  tags: [],
                  is_active: true,
                  is_deleted: false,
                  created_at: new Date(),
                  updated_at: new Date()
                });
              }
            }
            const ids = dbc.products.find({ slug: /^loadtest-product-/ }, { _id: 1 }).limit(5).map(d => d._id.toString()).toArray();
            print("PRODUCT_IDS=" + ids.join(","));
            ' | grep '^PRODUCT_IDS=' | cut -d= -f2 > /tmp/lt-product-ids

          echo "✅ Product IDs: $(cat /tmp/lt-product-ids)"

      # ── Step 6/7: k6 ────────────────────────────────────────
      - name: "📦 Step 6/7 · Install k6 load testing tool"
        run: |
          echo "── Installing k6 ──"
          sudo apt-get update -q
          if sudo apt-get install -yq k6 2>/dev/null; then
            echo "✅ k6 installed via apt"
          else
            curl -sL https://github.com/grafana/k6/releases/download/v0.57.0/k6-v0.57.0-linux-amd64.tar.gz \
              -o /tmp/k6.tar.gz
            tar -xzf /tmp/k6.tar.gz -C /tmp
            sudo cp /tmp/k6-v0.57.0-linux-amd64/k6 /usr/local/bin/
            echo "✅ k6 installed via release binary"
          fi
          k6 version

      - name: "🏋️ Step 7/7 · Run k6 load test (full checkout flow)"
        env:
          BASE_URL: http://localhost
          API_KEY: ci_loadtest_api_key
          PRODUCT_IDS: "$(cat /tmp/lt-product-ids)"
          LOADTEST_USER_COUNT: "200"
        run: |
          echo "══════════════════════════════════════════"
          echo "  Step 7/7: RUNNING k6 LOAD TEST"
          echo "  Base URL:    $BASE_URL"
          echo "  VU count:    200"
          echo "  Script:      loadtest/checkout-flow.js"
          echo "══════════════════════════════════════════"

          k6 run --summary-export=/tmp/k6-summary.json loadtest/checkout-flow.js

      # ── Artifacts & Cleanup ──────────────────────────────────
      - name: "📤 Upload k6 report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-report
          path: /tmp/k6-summary.json
          retention-days: 7

      - name: "🧹 Tear down stack"
        if: always()
        run: |
          echo "── Tearing down docker compose stack ──"
          docker compose --env-file .env.ci -f docker/docker-compose.yml down -v --remove-orphans || true

      - name: "📝 Write Load Test Summary"
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"; MSG="Load test completed successfully."
          else
            ICON="❌"; MSG="Load test failed — check logs above."
          fi

          {
            echo "## 📈 Load Test · k6 Performance Suite"
            echo ""
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Stack | 3× API nodes behind nginx LB |"
            echo "| Virtual Users | 200 |"
            echo "| Script | \`loadtest/checkout-flow.js\` |"
            echo "| Status | ${ICON} ${MSG} |"
            echo ""

            # Parse k6 summary if available
            if [ -f /tmp/k6-summary.json ]; then
              echo "### k6 Results"
              echo ""
              echo '```json'
              cat /tmp/k6-summary.json | head -50
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"