version: '3.9'
services:
  postgres:
    image: postgres:15
    env_file: .env
    command: postgres -c timezone=Asia/Ho_Chi_Minh
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - emc-network

  mongo:
    image: mongo:7
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - emc-network

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD}
    env_file: .env
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - emc-network

  localstack:
    image: localstack/localstack:3.4.0
    env_file: .env
    environment:
      - AWS_DEFAULT_REGION=${AWS_REGION}
    ports:
      - "4566:4566"
    volumes:
      - localstackdata:/var/lib/localstack
    networks:
      - emc-network

volumes:
  pgdata:
  mongodata:
  redisdata:
  localstackdata:

networks:
  emc-network:
    driver: bridge
