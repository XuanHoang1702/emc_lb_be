version: "2"

run:
  timeout: 5m
  tests: false
  go: "1.24"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  default: none
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - misspell
    - revive
  settings:
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 100
    goconst:
      min-len: 2
      min-occurrences: 2
    revive:
      rules:
        - name: exported
        - name: var-naming
        - name: unexported-return
  exclusions:
    paths:
      - src/docs

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
